name: eval

# Builds the eval seed hands with each engine variant, scores the decks and has a judge model
# compare them blind. Costs API credits: run it by hand from the Actions tab.
# Needs the repository secret ANTHROPIC_API_KEY (use a key from a Console workspace with a spend limit).

on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Engine variants, comma-separated; the first is the baseline (e.g. v1,v2 or v1,v2-review)"
        default: "v1,v2"
      hands:
        description: "all, a number (first N hands) or comma-separated hand ids from web/evals/hands.json"
        default: "judith-aristocrats,esper-flicker,krenko-goblins"
      model:
        description: "Builder model"
        default: "claude-sonnet-5-5"
      judge:
        description: "Judge model, or none"
        default: "claude-opus-5-5"
      repeat:
        description: "Builds per hand and variant"
        default: "1"
      concurrency:
        description: "Builds running at the same time"
        default: "2"
      max_usd:
        description: "Budget in USD: no new builds or judging once the estimated spend reaches it"
        default: "3.5"

permissions:
  contents: write

concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Check the key is set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the repository secret ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Hands resolve on Scryfall
        run: node scripts/eval.mjs check
      - name: Run the eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VARIANTS: ${{ inputs.variants }}
          HANDS: ${{ inputs.hands }}
          MODEL: ${{ inputs.model }}
          JUDGE: ${{ inputs.judge }}
          REPEAT: ${{ inputs.repeat }}
          CONCURRENCY: ${{ inputs.concurrency }}
          MAX_USD: ${{ inputs.max_usd }}
        run: |
          set -o pipefail
          node scripts/eval.mjs run --variants "$VARIANTS" --hands "$HANDS" --model "$MODEL" --judge "$JUDGE" \
            --repeat "$REPEAT" --concurrency "$CONCURRENCY" --max-usd "$MAX_USD" --out eval-out 2>&1 | tee eval-out.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ github.run_id }}
          path: |
            web/eval-out/
            web/eval-out.log
      - name: Publish to the ci-output branch (evals/<run>)
        if: always() && github.repository == 'M-Sahin/mtg-master'
        env:
          VARIANTS: ${{ inputs.variants }}
          HANDS: ${{ inputs.hands }}
        run: |
          dest="evals/$(date -u +%F)-${{ github.run_id }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the web workflow also rewrites ci-output, so start from the latest tip and retry
          for try in 1 2 3; do
            rm -rf /tmp/ci-output && git worktree prune
            if git fetch -q origin ci-output; then git worktree add -q --detach /tmp/ci-output FETCH_HEAD; else mkdir -p /tmp/ci-output && git -C /tmp/ci-output init -q -b ci-output; fi
            mkdir -p "/tmp/ci-output/$dest"
            cp -r eval-out/. "/tmp/ci-output/$dest/" 2>/dev/null || true
            cp eval-out.log "/tmp/ci-output/$dest/" 2>/dev/null || true
            mkdir -p /tmp/ci-output/web && echo '{"git":{"deploymentEnabled":false}}' | tee /tmp/ci-output/vercel.json > /tmp/ci-output/web/vercel.json
            (cd /tmp/ci-output && git add -A && git commit -q -m "Eval ${{ github.run_id }}: $VARIANTS on $HANDS hands" && \
              git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-output) && exit 0
            git worktree remove --force /tmp/ci-output 2>/dev/null || true
            sleep $((try * 10))
          done
          echo "::warning::Couldn't publish the eval to ci-output; it's in the run's artifacts."
