name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (offline, Scryfall mocked)
        run: python -m unittest discover -s tests -v
      - name: Package the skill
        run: python -m zipfile -c mtg-master.skill mtg-master/
      - uses: actions/upload-artifact@v4
        with:
          name: mtg-master.skill
          path: mtg-master.skill
