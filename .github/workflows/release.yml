name: release

# Publishes a GitHub Release with the packaged skill attached. Either:
#  - push a tag like v1.0.3, or
#  - Actions → release → Run workflow, and enter the version (the tag is created for you).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.3 (must have a line in the README changelog)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Package the skill
        run: |
          find mtg-master -name __pycache__ -prune -exec rm -rf {} +
          python -m zipfile -c mtg-master.skill mtg-master/
      - name: Release notes from the changelog
        run: |
          v="${TAG#v}"
          notes=$(grep -E "^- \*\*${v//./\\.}\*\*" README.md | sed -E 's/^- \*\*[0-9.]+\*\*: ?//' || true)
          {
            echo "${notes:-See the changelog in the README.}"
            echo
            echo "**Install the skill:** download \`mtg-master.skill\` below and upload it in Claude (Customize → Skills), or copy the \`mtg-master/\` folder to \`~/.claude/skills/\` for Claude Code."
            echo
            echo "**Host the web app:** see [web/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/web/README.md)."
          } > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" mtg-master.skill --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
