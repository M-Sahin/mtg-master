name: release

# Push a tag like v1.0.3 to publish a GitHub Release with the packaged skill attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Package the skill
        run: |
          find mtg-master -name __pycache__ -prune -exec rm -rf {} +
          python -m zipfile -c mtg-master.skill mtg-master/
      - name: Release notes from the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          notes=$(grep -E "^- \*\*${v//./\\.}\*\*" README.md | sed -E 's/^- \*\*[0-9.]+\*\*: ?//' || true)
          {
            echo "${notes:-See the changelog in the README.}"
            echo
            echo "**Install the skill:** download \`mtg-master.skill\` below and upload it in Claude (Customize → Skills), or copy the \`mtg-master/\` folder to \`~/.claude/skills/\` for Claude Code."
            echo
            echo "**Host the web app:** see [web/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/web/README.md)."
          } > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" mtg-master.skill --title "$GITHUB_REF_NAME" --notes-file notes.md
