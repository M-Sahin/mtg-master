name: ev-data

# Builds the Box EV data (booster odds from taw/magic-sealed-data, Cardmarket prices from
# Scryfall) once a day and publishes it to the ev-data branch, which the site reads.
# No API key or secret needed. The branch keeps only the latest data (one commit).

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "Include sets released on or after this date"
        default: "2020-01-01"
      only:
        description: "Only these products, comma-separated (a test run: nothing is published)"
        default: ""
      probe:
        description: "Log MTGJSON's box records for this many sets"
        default: "0"

permissions:
  contents: write

concurrency:
  group: ev-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build the data
        env:
          SINCE: ${{ inputs.since || '2020-01-01' }}
          ONLY: ${{ inputs.only }}
          PROBE: ${{ inputs.probe || '0' }}
        run: |
          set -o pipefail
          node scripts/build-ev.mjs --out ev-out --since "$SINCE" ${ONLY:+--only "$ONLY"} --probe "$PROBE" 2>&1 | tee ev-build.log
      - name: Publish to the ev-data branch
        if: github.repository == 'M-Sahin/mtg-master' && !inputs.only
        run: |
          rm -rf /tmp/ev-data && mkdir -p /tmp/ev-data/ev /tmp/ev-data/web
          cp -r ev-out/. /tmp/ev-data/ev/
          cp ev-build.log /tmp/ev-data/
          # Vercel must not try to deploy this branch
          echo '{"git":{"deploymentEnabled":false}}' | tee /tmp/ev-data/vercel.json > /tmp/ev-data/web/vercel.json
          cd /tmp/ev-data
          git init -q -b ev-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Box EV data $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ev-data
      - name: Publish the log of a test run to ci-output (ev-test/<run>.log)
        if: always() && inputs.only && github.repository == 'M-Sahin/mtg-master'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for try in 1 2 3; do
            rm -rf /tmp/ci-output && git worktree prune
            git fetch -q origin ci-output && git worktree add -q --detach /tmp/ci-output FETCH_HEAD || exit 0
            mkdir -p /tmp/ci-output/ev-test && cp ev-build.log "/tmp/ci-output/ev-test/${{ github.run_id }}.log" 2>/dev/null || echo "no log" > "/tmp/ci-output/ev-test/${{ github.run_id }}.log"
            (cd /tmp/ci-output && git add -A && git commit -q -m "EV test run ${{ github.run_id }}" && \
              git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-output) && exit 0
            git worktree remove --force /tmp/ci-output 2>/dev/null || true
            sleep $((try * 10))
          done
