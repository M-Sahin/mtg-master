name: web

on:
  push:
    paths: ["web/**", "mtg-master/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "mtg-master/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Known vulnerabilities in the app's dependencies
        # critical ones in what ships to users fail the build; the report shows the rest
        run: |
          npm audit --omit=dev || true
          npm audit --omit=dev --audit-level=critical
      - name: Skill copy is in sync with ../mtg-master
        run: npm run check-skill
      - name: Unit tests
        run: npm test
      - name: Build (includes Next's type check)
        run: npm run build
      - name: Typecheck (tests and scripts too)
        run: npm run typecheck
      - name: Live Scryfall lookups (double-faced, split, accented names)
        run: node scripts/check-scryfall-live.mjs
      - name: Eval hands resolve on Scryfall; Commander Spellbook probe
        continue-on-error: true # third-party service; the eval workflow runs this check strictly
        run: |
          set -o pipefail
          node scripts/eval.mjs check 2>&1 | tee eval-check.log
      - name: Calibrate the role detector against Scryfall Tagger
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/calibrate-analysis.mjs 2>&1 | tee calibrate.log
      - name: Opening-hand check on sample decks
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/check-openers.mjs 2>&1 | tee openers.log
      - name: End-to-end (demo mode, real Scryfall)
        env:
          # Cloudflare's public Turnstile test keys (always pass): the browser checks run the real
          # widget under the real security policy
          TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
        run: |
          npm start -- -p 3000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/config > /dev/null && break; sleep 1; done
          set -o pipefail
          node scripts/e2e-demo.mjs 2>&1 | tee e2e.log
      - name: Screenshots
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          mkdir -p shots
          set -o pipefail
          OUT=shots node scripts/screenshots.mjs 2>&1 | tee shots/log.txt
      - name: Server log
        if: always()
        run: cat server.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: web-screenshots-and-lockfile
          path: |
            web/shots/
            web/package-lock.json
      - name: Publish screenshots, lockfile and e2e log to the ci-output branch
        if: always() && github.event_name != 'pull_request' && github.repository == 'M-Sahin/mtg-master'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          mkdir -p /tmp/out && cp -r shots /tmp/out/ 2>/dev/null || true
          cp package-lock.json e2e.log server.log eval-check.log calibrate.log openers.log /tmp/out/ 2>/dev/null || true
          # keep earlier eval reports (published by the eval workflow)
          (cd "$GITHUB_WORKSPACE" && git fetch -q origin ci-output && git archive FETCH_HEAD evals | tar -x -C /tmp/out) 2>/dev/null || true
          # this branch only holds CI output: tell Vercel not to deploy it (it reads vercel.json from the
          # branch being deployed, at the root and in the project's root directory, web/)
          mkdir -p /tmp/out/web
          echo '{"git":{"deploymentEnabled":false}}' > /tmp/out/vercel.json
          cp /tmp/out/vercel.json /tmp/out/web/vercel.json
          echo "$GITHUB_SHA $REF_NAME $(date -u +%FT%TZ)" > /tmp/out/SOURCE
          cd /tmp/out
          git init -q -b ci-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "CI output for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-output

  docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build the self-hosting image
        run: docker build -t hundredfoldz .
      - name: Run it in demo mode and test end to end
        run: |
          docker run -d --name hf -p 3001:3000 hundredfoldz
          for i in $(seq 1 40); do curl -sf http://localhost:3001/api/config > /dev/null && break; sleep 1; done
          BASE_URL=http://localhost:3001 node scripts/e2e-demo.mjs
      - name: Container log
        if: always()
        run: docker logs hf || true
