name: Rules or bracket update
description: Wizards changed the Commander brackets, Game Changers or ban list and the app/skill is out of date
labels: [rules-update]
body:
  - type: input
    id: source
    attributes:
      label: Link to the official announcement
      placeholder: https://magic.wizards.com/en/news/announcements/...
    validations: { required: true }
  - type: textarea
    id: change
    attributes:
      label: What changed?
      description: For example "Bracket 3 now allows 4 Game Changers". The Game Changers list itself is read live from Scryfall; rule text lives in web/lib/shared/bracket.ts and mtg-master/references/commander.md.
    validations: { required: true }
